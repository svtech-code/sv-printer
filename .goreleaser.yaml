version: 2

builds:
  - id: sv-printer
    main: ./cmd/sv-printer
    binary: sv-printer
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: sv-license
    main: ./cmd/sv-license
    binary: sv-license
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: sv-printer
    builds:
      - sv-printer
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "sv-printer_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  - id: sv-license
    builds:
      - sv-license
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "sv-license_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
