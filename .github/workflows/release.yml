name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Native Installers
        run: |
          # 1. Windows Installer (amd64)
          WIN_BIN=$(find dist -path "*windows_amd64*" -name "sv-printer.exe" | head -n 1)
          cp "$WIN_BIN" ./sv-printer.exe
          cd scripts
          makensis installer.nsi
          mv SV_Printer_Setup.exe ../SV_Printer_Setup_windows_amd64.exe
          cd ..
          
          # 2. macOS App (amd64)
          MAC_AMD_BIN=$(find dist -path "*darwin_amd64*" -name "sv-printer" | head -n 1)
          cp "$MAC_AMD_BIN" ./sv-printer
          ./scripts/build_mac_app.sh
          zip -r SV_Printer_darwin_amd64.app.zip "SV Printer.app"
          rm -rf "SV Printer.app"
          
          # 3. macOS App (arm64)
          MAC_ARM_BIN=$(find dist -path "*darwin_arm64*" -name "sv-printer" | head -n 1)
          if [ -n "$MAC_ARM_BIN" ]; then
            cp "$MAC_ARM_BIN" ./sv-printer
            ./scripts/build_mac_app.sh
            zip -r SV_Printer_darwin_arm64.app.zip "SV Printer.app"
            rm -rf "SV Printer.app"
          fi

      - name: Upload Native Installers to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          UPLOAD_CMD="gh release upload $TAG_NAME SV_Printer_Setup_windows_amd64.exe SV_Printer_darwin_amd64.app.zip"
          if [ -f "SV_Printer_darwin_arm64.app.zip" ]; then
            UPLOAD_CMD="$UPLOAD_CMD SV_Printer_darwin_arm64.app.zip"
          fi
          $UPLOAD_CMD
